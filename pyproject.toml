[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smile-lang"
version = "0.4.0"
description = "Smile Language - 軽くて安全で優しいプログラミング言語"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["lark>=1.1"]

[project.scripts]
smile = "smile.compiler:main"

[tool.setuptools.packages.find]
include = ["smile*"]

[tool.setuptools.package-data]
smile = ["grammar.lark", "logo.svg"]
